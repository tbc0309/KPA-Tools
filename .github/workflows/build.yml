name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (!(Test-Path -LiteralPath $sdkManager)) { throw "sdkmanager not found: $sdkManager" }
          & $sdkManager "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed: $LASTEXITCODE" }
      - name: Build
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.KPA_SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.KPA_SIGNING_STORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) { throw 'Release signing secrets are missing.' }
          [IO.File]::WriteAllBytes("$PWD/signing.p12", [Convert]::FromBase64String($env:SIGNING_KEY))
          ./build.ps1 -Jdk $env:JAVA_HOME -Sdk $env:ANDROID_HOME -OutputApk "$PWD/KPA-Assistant.apk" -SigningKey "$PWD/signing.p12" -SigningStorePassword $env:SIGNING_PASSWORD -SigningAlias pegasus
      - name: Set build name
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'AndroidManifest.xml' -Raw
          if ($manifest -notmatch 'versionName="([^"]+)"') { throw 'versionName not found' }
          "APK_NAME=KPA-Tools-v$($Matches[1]).apk" >> $env:GITHUB_ENV
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: KPA-Assistant.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = $env:APK_NAME
          $notes = ".github/release-notes/$tag.md"
          Copy-Item -LiteralPath 'KPA-Assistant.apk' -Destination $asset
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
            if (Test-Path -LiteralPath $notes) { gh release edit $tag --title "KPA助手 $($tag.TrimStart('v'))" --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY }
            $oldAssets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
            foreach ($old in $oldAssets) {
              if ($old -like 'KPA-Tools-v*.apk' -and $old -notlike 'KPA-Tools-Root-*' -and $old -ne $asset) { gh release delete-asset $tag $old -y --repo $env:GITHUB_REPOSITORY }
            }
          } else {
            if (Test-Path -LiteralPath $notes) { gh release create $tag $asset --title "KPA助手 $($tag.TrimStart('v'))" --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY }
            else { gh release create $tag $asset --title "KPA助手 $($tag.TrimStart('v'))" --generate-notes --latest --repo $env:GITHUB_REPOSITORY }
          }
